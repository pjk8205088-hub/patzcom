<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Seller Hub | PATZCOM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
:root{--ink:#191919;--muted:#707070;--line:#e5e5e5;--bg:#f7f7f7;--card:#fff;--blue:#3665f3;--blue-d:#2b50c4;--green:#05823f;--red:#d50b0b;--amber:#c47a00;--radius:16px}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top-row{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 24px;font-size:12px;color:var(--muted)}
.top-row .sp{flex:1}.top-row a{color:var(--ink)}
.brand-row{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:6px 24px 14px}
.logo{font-size:30px;font-weight:800;letter-spacing:-1.5px;line-height:1}.logo b:nth-child(1){color:#e53238}.logo b:nth-child(2){color:#0064d2}.logo b:nth-child(3){color:#f5af02}.logo b:nth-child(4){color:#86b817}.logo small{display:block;font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted)}
.search{flex:1;display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;max-width:760px}
.search input{flex:1;border:0;padding:10px 18px;outline:none}.search button{border:0;background:var(--blue);color:#fff;padding:0 28px;font-weight:700;cursor:pointer}
.tabs{max-width:1440px;margin:0 auto;display:flex;gap:2px;padding:0 24px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}.tabs button:hover{color:var(--ink)}
.page{max-width:1440px;margin:0 auto;padding:22px 24px 60px;display:grid;grid-template-columns:220px 1fr;gap:24px}
.side h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px}
.side a{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;color:var(--ink);cursor:pointer}
.side a.on{background:#e8eefc;font-weight:700}.side a:hover{background:#efefef;text-decoration:none}
.side .cnt{color:var(--muted);font-size:12px}
h1{font-size:26px;margin:0 0 16px;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
.card h2{font-size:17px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.task{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.task:first-of-type{border-top:0}
.task b{font-size:18px}.task:hover span{text-decoration:underline}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px}.kpi .l{color:var(--muted);font-size:13px}.kpi .d{font-size:12px;margin-top:4px}
.up{color:var(--green)}.down{color:var(--red)}
.chart{height:200px;display:flex;align-items:flex-end;gap:4px;padding-top:10px;border-bottom:1px solid var(--line)}
.chart div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:11px;padding:3px 6px;border-radius:4px;white-space:nowrap}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{border:0;background:#fff;padding:5px 12px;cursor:pointer;font-size:12px}.seg button.on{background:var(--ink);color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid #c7c7c7;border-radius:8px;padding:8px 10px;background:#fff}
.toolbar input[type=search]{min-width:260px}
.btn{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:#f0f4ff}.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-d)}
.btn.sm{padding:4px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:#c7c7c7;color:var(--ink)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafafa;position:sticky;top:0;cursor:default}th.s{cursor:pointer}th.s:hover{color:var(--ink)}
tr:hover td{background:#fbfbfb}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#f2f2f2}
.ttl{font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:520px}
.sub{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eee}
.pill.g{background:#e6f4ea;color:var(--green)}.pill.r{background:#fde8e8;color:var(--red)}.pill.a{background:#fff4dc;color:var(--amber)}.pill.b{background:#e8eefc;color:var(--blue)}
.tscroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted)}
.bulk{display:none;background:#e8eefc;border-radius:10px;padding:8px 12px;margin-bottom:10px;gap:8px;align-items:center}.bulk.on{display:flex}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:50}.drawer-bg.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(640px,100%);background:#fff;z-index:51;transform:translateX(100%);transition:.2s;display:flex;flex-direction:column}
.drawer.on{transform:none}.drawer header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer header h2{margin:0;font-size:19px}.drawer .body{padding:18px 22px;overflow:auto;flex:1}.drawer footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.f{display:grid;gap:4px;margin-bottom:12px}.f label{font-size:12px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid #c7c7c7;border-radius:8px;padding:9px 10px;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imgs{display:flex;flex-wrap:wrap;gap:8px}.imgs div{position:relative}.imgs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.imgs button{position:absolute;top:-6px;right:-6px;border:0;background:#111;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:11px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:999px;z-index:99;display:none}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.x{border:0;background:none;font-size:22px;cursor:pointer}
.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.meter{display:flex;justify-content:space-between;margin:10px 0 4px}
.view{display:none}.view.on{display:block}
@media(max-width:1000px){.page{grid-template-columns:1fr}.side{display:flex;gap:4px;overflow:auto}.side h3{display:none}.g4,.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
</style></head><body>
<header class="top">
  <div class="top-row"><span>Hi <b id="who">seller</b>!</span><a href="/" target="_blank">View storefront</a><a href="/admin-classic.html#more-tools">More tools</a><span class="sp"></span><a href="/admin-products.html">Sell an item</a><a href="#" id="logout">Sign out</a></div>
  <div class="brand-row">
    <div class="logo"><b>P</b><b>A</b><b>T</b><b>Z</b>COM<small>Seller Hub</small></div>
    <form class="search" id="gsearch"><input id="gq" placeholder="Search listings, orders, buyers or item numbers"><button>Search</button></form>
    <button class="btn pri" onclick="openEditor()">+ Create listing</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main class="page"><aside class="side" id="side"></aside><section id="main"></section></main>
<div class="drawer-bg" id="dbg"></div>
<aside class="drawer" id="drawer"><header><h2 id="dtitle">Edit listing</h2><button class="x" onclick="closeDrawer()">&times;</button></header><div class="body" id="dbody"></div><footer id="dfoot"></footer></aside>
<div class="toast" id="toast"></div>
<script>
const S={tab:'overview',sub:null,products:[],revision:'',orders:[],messages:[],dash:null,sel:new Set(),page:1,per:50,q:'',sort:'title',dir:1,range:30};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const day=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
async function api(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){location.href='/admin-login.html';throw new Error('login')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||('HTTP '+r.status));return j}
const qty=p=>Number.isInteger(p.quantity)?p.quantity:(p.available?1:0);
const isActive=p=>p.available&&qty(p)>0;
const paid=o=>['completed','captured','paid','COMPLETED','partially_refunded','refunded'].includes(o.status);
const num=v=>v===null||v===undefined||v===''?null:Number(v);
const feeOf=o=>num(o.payment_fee);const netOf=o=>num(o.net_amount);
const finalNet=o=>netOf(o)===null?null:netOf(o)-Number(o.refund_debit||0);
const SUBS_PAY=1;
const TABS=[['overview','Overview'],['orders','Orders'],['listings','Listings'],['marketing','Marketing'],['performance','Performance'],['payments','Payments'],['research','Research'],['reports','Reports'],['messages','Messages']];
const SUBS={
 orders:[['all','All orders'],['awaiting','Awaiting shipment'],['packing','Packing'],['shipped','Paid and shipped'],['delivered','Delivered'],['hold','On hold'],['unpaid','Awaiting payment']],
 listings:[['active','Active'],['out','Out of stock'],['unsold','Ended / Unsold'],['drafts','Drafts']],
 marketing:[['promos','Promotions'],['coupons','Coupons']],
 performance:[['summary','Summary'],['sales','Sales'],['traffic','Inventory health']],
 payments:[['summary','Summary'],['tx','All transactions'],['monthly','Monthly statement'],['refunds','Refunds']],
 research:[['catalog','Catalog insights'],['pricing','Pricing']],
 reports:[['downloads','Downloads']],
 messages:[['inbox','Inbox'],['unread','Unread']]};
function counts(){const o=S.orders,p=S.products;return{all:o.length,awaiting:o.filter(x=>paid(x)&&x.fulfillment_status==='awaiting_fulfillment').length,packing:o.filter(x=>x.fulfillment_status==='packing').length,shipped:o.filter(x=>x.fulfillment_status==='shipped').length,delivered:o.filter(x=>x.fulfillment_status==='delivered').length,hold:o.filter(x=>x.fulfillment_status==='on_hold').length,unpaid:o.filter(x=>!paid(x)).length,active:p.filter(isActive).length,out:p.filter(x=>x.available&&qty(x)===0).length,unsold:p.filter(x=>!x.available).length,drafts:0,inbox:S.messages.length,unread:S.messages.filter(m=>!['read','closed'].includes(m.status)).length}}
function nav(tab,sub){S.tab=tab;S.sub=sub||(SUBS[tab]?SUBS[tab][0][0]:null);S.page=1;S.sel.clear();location.hash=tab+(S.sub?'/'+S.sub:'');render()}
function render(){
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="nav('${k}')">${l}</button>`).join('');
 const c=counts();const subs=SUBS[S.tab];
 $('#side').innerHTML=subs?`<h3>${TABS.find(t=>t[0]===S.tab)[1]}</h3>`+subs.map(([k,l])=>`<a class="${S.sub===k?'on':''}" onclick="nav('${S.tab}','${k}')">${l}<span class="cnt">${c[k]??''}</span></a>`).join(''):`<h3>Shortcuts</h3><a onclick="nav('orders','awaiting')">Awaiting shipment<span class="cnt">${c.awaiting}</span></a><a onclick="nav('listings','active')">Active listings<span class="cnt">${c.active}</span></a><a onclick="nav('listings','out')">Out of stock<span class="cnt">${c.out}</span></a><a onclick="nav('messages','unread')">Unread messages<span class="cnt">${c.unread}</span></a><a href="/admin-classic.html#more-tools">eBay sync &amp; import tools</a>`;
 (V[S.tab]||V.overview)();
}
const V={};
const set=h=>$('#main').innerHTML=h;
/* ---------- Overview ---------- */
function salesSeries(days){const now=new Date();now.setHours(0,0,0,0);const arr=[...Array(days)].map((_,i)=>{const d=new Date(now);d.setDate(d.getDate()-(days-1-i));return{d,v:0,n:0}});S.orders.filter(paid).forEach(o=>{const t=new Date(o.created_at);t.setHours(0,0,0,0);const i=Math.round((t-arr[0].d)/864e5);if(i>=0&&i<days){arr[i].v+=Number(o.total);arr[i].n++}});return arr}
function chart(days){const s=salesSeries(days);const m=Math.max(1,...s.map(x=>x.v));return`<div class="chart">${s.map(x=>`<div style="height:${x.v/m*100}%" data-t="${x.d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}: ${usd(x.v)} (${x.n})"></div>`).join('')}</div><div class="axis"><span>${day(s[0].d)}</span><span>Today</span></div>`}
V.overview=()=>{const c=counts();const s=salesSeries(S.range);const tot=s.reduce((a,x)=>a+x.v,0),n=s.reduce((a,x)=>a+x.n,0);const prev=salesSeries(S.range*2).slice(0,S.range).reduce((a,x)=>a+x.v,0);const ch=prev?((tot-prev)/prev*100):0;
 const inv=S.products.filter(isActive).reduce((a,p)=>a+Number(p.price)*qty(p),0);
 set(`<h1>Overview</h1>
 <div class="grid g3">
  <div class="card"><h2>Tasks</h2>
   <div class="task" onclick="nav('orders','awaiting')"><span>Ship orders</span><b>${c.awaiting}</b></div>
   <div class="task" onclick="nav('orders','unpaid')"><span>Awaiting payment</span><b>${c.unpaid}</b></div>
   <div class="task" onclick="nav('messages','unread')"><span>Buyer messages</span><b>${c.unread}</b></div>
   <div class="task" onclick="nav('listings','out')"><span>Restock out-of-stock listings</span><b>${c.out}</b></div></div>
  <div class="card" style="grid-column:span 2"><h2>Sales <span class="seg">${[7,30,90].map(d=>`<button class="${S.range===d?'on':''}" onclick="S.range=${d};render()">${d} days</button>`).join('')}</span></h2>
   <div class="grid g3"><div class="kpi"><div class="l">Sales</div><div class="v">${usd(tot)}</div><div class="d ${ch>=0?'up':'down'}">${prev?(ch>=0?'+':'')+ch.toFixed(1)+'% vs previous':'No previous period data'}</div></div>
   <div class="kpi"><div class="l">Orders</div><div class="v">${n}</div></div><div class="kpi"><div class="l">Avg. order value</div><div class="v">${usd(n?tot/n:0)}</div></div></div>${chart(S.range)}</div>
 </div>
 <div class="grid g4">
  <div class="card kpi" onclick="nav('listings','active')" style="cursor:pointer"><div class="l">Active listings</div><div class="v">${c.active}</div><div class="d sub">${usd(inv)} listed value</div></div>
  <div class="card kpi" onclick="nav('listings','unsold')" style="cursor:pointer"><div class="l">Ended / unsold</div><div class="v">${c.unsold}</div></div>
  <div class="card kpi"><div class="l">Brands</div><div class="v">${S.dash?.catalog?.vendorCount??'--'}</div></div>
  <div class="card kpi"><div class="l">Categories</div><div class="v">${S.dash?.catalog?.categoryCount??'--'}</div></div>
 </div>
 <div class="card"><h2>Recent orders <a onclick="nav('orders')">See all</a></h2>${ordersTable(S.orders.slice(0,5),true)}</div>`)};
/* ---------- Listings ---------- */
function listFiltered(){const q=S.q.toLowerCase();let L=S.products.filter(p=>S.sub==='active'?isActive(p):S.sub==='out'?(p.available&&qty(p)===0):S.sub==='unsold'?!p.available:S.sub==='drafts'?false:true);
 if(q)L=L.filter(p=>[p.title,p.sku,p.id,p.vendor,p.type].join(' ').toLowerCase().includes(q));
 if(S.cat)L=L.filter(p=>p.type===S.cat);
 L.sort((a,b)=>{const k=S.sort;let x=k==='price'||k==='quantity'?Number(k==='quantity'?qty(a):a.price):String(a[k]||'').toLowerCase(),y=k==='price'||k==='quantity'?Number(k==='quantity'?qty(b):b.price):String(b[k]||'').toLowerCase();return(x>y?1:x<y?-1:0)*S.dir});return L}
function sortBy(k){S.dir=S.sort===k?-S.dir:1;S.sort=k;render()}
V.listings=()=>{const L=listFiltered();const pages=Math.max(1,Math.ceil(L.length/S.per));S.page=Math.min(S.page,pages);const rows=L.slice((S.page-1)*S.per,S.page*S.per);const cats=[...new Set(S.products.map(p=>p.type).filter(Boolean))].sort();const ar=k=>S.sort===k?(S.dir>0?' ▲':' ▼'):'';
 const title={active:'Manage active listings',out:'Out of stock',unsold:'Ended / unsold listings',drafts:'Drafts'}[S.sub];
 set(`<h1>${title} (${L.length})</h1><div class="card">
 <div class="toolbar"><input type="search" id="lq" placeholder="Search by title, SKU, brand or item number" value="${esc(S.q)}"><select id="lcat"><option value="">All categories</option>${cats.map(c=>`<option ${S.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="lper">${[25,50,100,200].map(n=>`<option ${S.per===n?'selected':''}>${n}</option>`).join('')}</select><span class="sub">per page</span><span style="flex:1"></span><button class="btn ghost" onclick="exportCSV('listings')"><i class="bi bi-download"></i> Download</button><button class="btn pri" onclick="openEditor()">Create listing</button></div>
 <div class="bulk ${S.sel.size?'on':''}"><b>${S.sel.size} selected</b><button class="btn sm" onclick="bulkPrice()">Edit price</button><button class="btn sm" onclick="bulkQty()">Edit quantity</button>${S.sub==='unsold'?'<button class="btn sm" onclick="bulkAvail(true)">Relist</button>':'<button class="btn sm" onclick="bulkAvail(false)">End listings</button>'}<button class="btn sm ghost" onclick="S.sel.clear();render()">Clear</button></div>
 ${rows.length?`<div class="tscroll"><table><thead><tr><th><input type="checkbox" id="lall" ${rows.every(p=>S.sel.has(p.id))?'checked':''}></th><th>Photo</th><th class="s" onclick="sortBy('title')">Title${ar('title')}</th><th class="s" onclick="sortBy('type')">Category${ar('type')}</th><th class="s" onclick="sortBy('price')">Current price${ar('price')}</th><th class="s" onclick="sortBy('quantity')">Available qty${ar('quantity')}</th><th>Status</th><th>Actions</th></tr></thead><tbody>
 ${rows.map(p=>`<tr><td><input type="checkbox" data-id="${esc(p.id)}" ${S.sel.has(p.id)?'checked':''}></td><td><img class="thumb" loading="lazy" src="${esc(p.images?.[0]||'')}" alt=""></td><td><a class="ttl" href="/products/${esc(p.handle||p.id)}.html" target="_blank">${esc(p.title)}</a><div class="sub">Item ${esc(p.id)}${p.sku?' · SKU '+esc(p.sku):''} · ${esc(p.vendor||'')} · ${p.condition==='used'?'Used':'New'}</div></td><td class="sub">${esc(p.type||'')}</td><td><input type="number" step="0.01" value="${p.price}" data-price="${esc(p.id)}" style="width:100px;border:1px solid #ddd;border-radius:6px;padding:5px"></td><td><input type="number" min="0" value="${qty(p)}" data-qty="${esc(p.id)}" style="width:70px;border:1px solid #ddd;border-radius:6px;padding:5px"></td><td>${isActive(p)?'<span class="pill g">Active</span>':p.available?'<span class="pill a">Out of stock</span>':'<span class="pill">Ended</span>'}</td><td><button class="btn sm" onclick="openEditor('${esc(p.id)}')">Edit</button></td></tr>`).join('')}
 </tbody></table></div><div class="pager"><span>Results ${(S.page-1)*S.per+1}-${Math.min(S.page*S.per,L.length)} of ${L.length}</span><span><button class="btn sm ghost" ${S.page<=1?'disabled':''} onclick="S.page--;render()">‹ Prev</button> Page ${S.page} / ${pages} <button class="btn sm ghost" ${S.page>=pages?'disabled':''} onclick="S.page++;render()">Next ›</button></span></div>`:`<div class="empty">${S.sub==='drafts'?'No drafts. Use Create listing to start one.':'No listings match.'}</div>`}</div>`);
 $('#lq').oninput=e=>{S.q=e.target.value;S.page=1;clearTimeout(S._qt);S._qt=setTimeout(()=>{render();const i=$('#lq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};
 $('#lcat').onchange=e=>{S.cat=e.target.value;S.page=1;render()};$('#lper').onchange=e=>{S.per=+e.target.value;S.page=1;render()};
 const all=$('#lall');if(all)all.onchange=e=>{rows.forEach(p=>e.target.checked?S.sel.add(p.id):S.sel.delete(p.id));render()};
 document.querySelectorAll('[data-id]').forEach(b=>b.onchange=e=>{e.target.checked?S.sel.add(b.dataset.id):S.sel.delete(b.dataset.id);render()});
 document.querySelectorAll('[data-price]').forEach(i=>i.onchange=()=>quickSave(i.dataset.price,{price:Number(i.value)}));
 document.querySelectorAll('[data-qty]').forEach(i=>i.onchange=()=>{const q=parseInt(i.value,10);quickSave(i.dataset.qty,{quantity:q,available:q>0})});
};
function payloadFrom(p,over={}){const m={...p,...over};return{title:m.title||'',sku:m.sku||'',vendor:m.vendor||'',type:m.type||'',price:Number(m.price),condition:m.condition||'new',quantity:Number.isInteger(m.quantity)?m.quantity:qty(p),available:!!m.available,images:m.images||[],desc_text:m.desc_text??p.desc_text??''}}
async function saveProduct(id,product){const r=await api('/api/admin/products',{method:'POST',body:JSON.stringify({revision:S.revision,id:id||undefined,product})});S.revision=r.revision;const i=S.products.findIndex(x=>x.id===r.product.id);if(i<0)S.products.push(r.product);else S.products[i]=r.product;return r.product}
async function quickSave(id,over){const p=S.products.find(x=>x.id===id);try{await saveProduct(id,payloadFrom(p,over));toast('Listing updated');render()}catch(e){toast(e.message);await loadProducts();render()}}
async function bulk(fn,label){const ids=[...S.sel];let ok=0;for(const id of ids){const p=S.products.find(x=>x.id===id);try{await saveProduct(id,payloadFrom(p,fn(p)));ok++}catch(e){toast(e.message);break}}S.sel.clear();toast(`${label}: ${ok}/${ids.length} updated`);render()}
function bulkPrice(){const v=prompt('New price in USD, or a percent change like +10% / -5%');if(!v)return;const m=v.trim().match(/^([+-]?\d+(?:\.\d+)?)%$/);bulk(p=>({price:m?Math.round(Number(p.price)*(1+Number(m[1])/100)*100)/100:Number(v)}),'Price')}
function bulkQty(){const v=parseInt(prompt('New available quantity'),10);if(!Number.isInteger(v)||v<0)return;bulk(()=>({quantity:v,available:v>0}),'Quantity')}
function bulkAvail(on){if(!on&&!confirm(`End ${S.sel.size} listing(s)? They will be hidden from the storefront.`))return;bulk(p=>({available:on,quantity:on?Math.max(1,qty(p)):qty(p)}),on?'Relisted':'Ended')}
/* ---------- Listing editor ---------- */
function openDrawer(t,b,f){$('#dtitle').textContent=t;$('#dbody').innerHTML=b;$('#dfoot').innerHTML=f;$('#drawer').classList.add('on');$('#dbg').classList.add('on')}
function closeDrawer(){$('#drawer').classList.remove('on');$('#dbg').classList.remove('on')}
$('#dbg').onclick=closeDrawer;
let ED=null;
function openEditor(id){const p=id?S.products.find(x=>x.id===id):{title:'',sku:'',vendor:'',type:'',price:'',condition:'new',quantity:1,available:true,images:[],desc_text:''};ED={id,images:[...(p.images||[])]};const cats=[...new Set(S.products.map(x=>x.type).filter(Boolean))].sort();
 openDrawer(id?'Edit listing':'Create listing',`
 <div class="f"><label>Photos (${ED.images.length}/30)</label><div class="imgs" id="eimgs"></div><div class="toolbar" style="margin-top:8px"><input id="eurl" placeholder="https://... image URL" style="flex:1"><button class="btn sm" onclick="addUrl()">Add URL</button><label class="btn sm">Upload<input type="file" accept="image/jpeg,image/png,image/webp" id="efile" hidden multiple></label></div></div>
 <div class="f"><label>Title</label><input id="et" maxlength="300" value="${esc(p.title)}"></div>
 <div class="frow"><div class="f"><label>Category</label><input id="ec" list="ecats" value="${esc(p.type)}"><datalist id="ecats">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div><div class="f"><label>Brand</label><input id="ev" value="${esc(p.vendor)}"></div></div>
 <div class="frow"><div class="f"><label>Custom label (SKU)</label><input id="es" value="${esc(p.sku)}"></div><div class="f"><label>Condition</label><select id="eco"><option value="new">New</option><option value="used" ${p.condition==='used'?'selected':''}>Used</option></select></div></div>

 <div class="f"><label><input type="checkbox" id="ea" ${p.available?'checked':''}> Listing is active on storefront</label></div>
 <div class="f"><label>Description</label><textarea id="ed" rows="10">${esc(p.desc_text||'')}</textarea></div>
 ${id?`<p class="sub">Item number ${esc(id)} · <a href="/products/${esc(p.handle||id)}.html" target="_blank">View on storefront</a></p>`:''}`,
 `<button class="btn ghost" onclick="closeDrawer()">Cancel</button><button class="btn pri" id="esave">${id?'Save changes':'List it'}</button>`);
 drawImgs();$('#efile').onchange=uploadFiles;$('#esave').onclick=submitEditor}
function drawImgs(){$('#eimgs').innerHTML=ED.images.map((u,i)=>`<div><img src="${esc(u.startsWith('http')?u:'/'+u)}"><button onclick="ED.images.splice(${i},1);drawImgs()">×</button></div>`).join('')||'<span class="sub">No photos yet</span>'}
function addUrl(){const u=$('#eurl').value.trim();if(u){ED.images.push(u);$('#eurl').value='';drawImgs()}}
async function uploadFiles(e){for(const f of e.target.files){const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(f)});try{const r=await api('/api/admin/product-image',{method:'POST',body:JSON.stringify({base64:b64})});ED.images.push(r.url);drawImgs()}catch(err){toast(err.message)}}}
async function submitEditor(){const b=$('#esave');b.disabled=true;const q=parseInt($('#eq').value,10);const product={title:$('#et').value,type:$('#ec').value,vendor:$('#ev').value,sku:$('#es').value,condition:$('#eco').value,price:Number($('#ep').value),quantity:q,available:$('#ea').checked,images:ED.images,desc_text:$('#ed').value};
 try{await saveProduct(ED.id,product);toast(ED.id?'Listing saved':'Listing created');closeDrawer();render()}catch(e){toast(e.message);b.disabled=false}}
/* ---------- Orders ---------- */
const FS={awaiting_fulfillment:['Awaiting shipment','a'],packing:['Packing','b'],shipped:['Shipped','g'],delivered:['Delivered','g'],on_hold:['On hold','r']};
function ordersTable(list,compact){if(!list.length)return'<div class="empty">No orders yet.</div>';return`<div class="tscroll"><table><thead><tr><th>Order</th><th>Date</th><th>Item</th><th>Total</th><th>Payment</th><th>Shipping</th>${compact?'':'<th>Tracking</th><th>Actions</th>'}</tr></thead><tbody>${list.map(o=>{const it=o.items?.[0]||{};const f=FS[o.fulfillment_status]||[o.fulfillment_status,''];return`<tr><td><b>${esc(o.reference)}</b><div class="sub">${esc(o.provider)} ${esc(o.provider_order_id||'')}</div></td><td class="sub">${day(o.created_at)}</td><td style="display:flex;gap:10px;align-items:center"><img class="thumb" src="${esc(it.image||'')}" alt=""><div><div class="ttl" style="max-width:320px">${esc(it.title||'')}</div><div class="sub">Qty ${it.quantity||1}${o.items.length>1?` · +${o.items.length-1} more`:''}</div></div></td><td><b>${usd(o.total)}</b></td><td>${payPill(o)}</td><td><span class="pill ${f[1]}">${esc(f[0])}</span></td>${compact?'':`<td>${o.tracking_number?esc(o.tracking_number):'<span class="sub">--</span>'}</td><td><button class="btn sm" onclick="openOrder('${o.id}')">${o.fulfillment_status==='awaiting_fulfillment'&&paid(o)?'Add tracking':'Manage'}</button></td>`}</tr>`}).join('')}</tbody></table></div>`}
V.orders=()=>{const q=S.q.toLowerCase();let L=S.orders.filter(o=>({all:1,awaiting:paid(o)&&o.fulfillment_status==='awaiting_fulfillment',packing:o.fulfillment_status==='packing',shipped:o.fulfillment_status==='shipped',delivered:o.fulfillment_status==='delivered',hold:o.fulfillment_status==='on_hold',unpaid:!paid(o)})[S.sub]);
 if(q)L=L.filter(o=>JSON.stringify(o).toLowerCase().includes(q));
 set(`<h1>${SUBS.orders.find(s=>s[0]===S.sub)[1]} (${L.length})</h1><div class="card"><div class="toolbar"><input type="search" id="oq" placeholder="Search order, item, PayPal ID" value="${esc(S.q)}"><span style="flex:1"></span><button class="btn ghost" onclick="loadOrders().then(render)"><i class="bi bi-arrow-clockwise"></i> Refresh</button><button class="btn ghost" onclick="exportCSV('orders')"><i class="bi bi-download"></i> Download</button></div>${ordersTable(L)}</div>`);
 $('#oq').onchange=e=>{S.q=e.target.value;render()}};
function openOrder(id){const o=S.orders.find(x=>x.id===id);openDrawer('Order '+o.reference,`
 <div class="card"><div class="frow"><div><div class="sub">Order date</div><b>${new Date(o.created_at).toLocaleString()}</b></div><div><div class="sub">Payment</div><b>${esc(o.provider)} · ${esc(o.status)}</b><div class="sub">${esc(o.provider_order_id||'')}</div></div></div></div>
 ${o.items.map(it=>`<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><img class="thumb" src="${esc(it.image||'')}"><div style="flex:1"><div class="ttl">${esc(it.title)}</div><div class="sub">Item ${esc(it.id)} · Qty ${it.quantity} × ${usd(it.unitAmount)}</div></div></div>`).join('')}
 <div class="card"><div class="sub">Buyer</div><b>${esc(o.buyer_name||'-')}</b> ${o.buyer_email?`&lt;<a href="mailto:${esc(o.buyer_email)}">${esc(o.buyer_email)}</a>&gt;`:'<span class="sub">(no email captured)</span>'}${o.buyer_phone?`<div class="sub">${esc(o.buyer_phone)}</div>`:''}
  <div class="sub" style="margin-top:8px">Ship to</div>${o.shipping_address?`<div style="white-space:pre-line">${esc([o.shipping_address.name,o.shipping_address.line1,o.shipping_address.line2,[o.shipping_address.city,o.shipping_address.state,o.shipping_address.postal_code].filter(Boolean).join(', '),o.shipping_address.country].filter(Boolean).join('\n'))}</div>`:'<span class="sub">Not captured</span>'}
  <div class="sub" style="margin-top:8px">Buyer emails</div><div>Order confirmation: ${o.paid_email_at?'<span class="pill g">Sent '+day(o.paid_email_at)+'</span>':'<span class="pill">Not sent</span>'} · Shipping notice: ${o.shipped_email_at?'<span class="pill g">Sent '+day(o.shipped_email_at)+'</span>':'<span class="pill">Not sent</span>'}</div>${o.email_error?`<div class="sub" style="color:var(--red)">Last error: ${esc(o.email_error)}</div>`:''}
  <div style="margin-top:8px;display:flex;gap:6px"><button class="btn sm" onclick="resendMail('${o.id}','paid')">Resend confirmation</button><button class="btn sm" onclick="resendMail('${o.id}','shipped')">Resend shipping notice</button></div></div>
 <div class="card"><div class="meter"><span>Subtotal</span><b>${usd(o.subtotal)}</b></div><div class="meter"><span>Shipping</span><b>${usd(o.shipping)}</b></div><div class="meter"><span>Order total</span><b>${usd(o.total)}</b></div></div>
 ${paid(o)?`<div class="card"><h2 style="font-size:15px">Settlement ${payPill(o)}</h2><div class="meter"><span>Gross</span><b>${usd(o.total)}</b></div><div class="meter"><span>Payment fee</span><b>${feeOf(o)===null?'not synced':'-'+usd(feeOf(o))}</b></div><div class="meter"><span>Refunded to buyer</span><b>-${usd(o.refunded_amount||0)}</b></div><div class="meter" style="border-top:1px solid var(--line);padding-top:8px"><span>Net payout</span><b>${finalNet(o)===null?'pending':usd(finalNet(o))}</b></div>
  ${(o.refunds||[]).map(r=>`<div class="sub">Refund ${day(r.at)}: -${usd(r.amount)} (${esc(r.status||'')}) ${esc(r.reason||'')}</div>`).join('')}
  <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn sm ghost" onclick="syncOrder('${o.id}')">Sync fees</button>${o.status!=='refunded'?`<input id="rfa" type="number" step="0.01" min="0.01" max="${(o.total-(o.refunded_amount||0)).toFixed(2)}" value="${(o.total-(o.refunded_amount||0)).toFixed(2)}" style="width:110px;border:1px solid #c7c7c7;border-radius:8px;padding:4px 8px"><input id="rfr" placeholder="Reason" style="flex:1;border:1px solid #c7c7c7;border-radius:8px;padding:4px 8px"><button class="btn sm" style="border-color:var(--red);color:var(--red)" onclick="refundOrder('${o.id}')">Refund</button>`:''}</div></div>`:''}
 <div class="f"><label>Shipping status</label><select id="ofs">${Object.entries(FS).map(([k,v])=>`<option value="${k}" ${o.fulfillment_status===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>
 <div class="f"><label>Tracking number</label><input id="otr" value="${esc(o.tracking_number||'')}" placeholder="Required when marking as shipped"></div>`,
 `<button class="btn ghost" onclick="closeDrawer()">Close</button><button class="btn pri" id="osave">Save</button>`);
 $('#osave').onclick=async()=>{try{const r=await api('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({fulfillmentStatus:$('#ofs').value,trackingNumber:$('#otr').value})});Object.assign(o,r.order);toast('Order updated');closeDrawer();render()}catch(e){toast(e.message)}}}
async function syncOrder(id){try{const r=await api('/api/admin/orders/'+id+'/settlement',{method:'POST',body:'{}'});Object.assign(S.orders.find(x=>x.id===id),r.order);toast('Fees synced');openOrder(id);render()}catch(e){toast(e.message)}}
async function refundOrder(id){const o=S.orders.find(x=>x.id===id);const amt=Number($('#rfa').value);const reason=$('#rfr').value;if(!(amt>0))return toast('Enter a refund amount');if(!confirm(`Refund ${usd(amt)} to the buyer via ${o.provider}? This sends real money back and cannot be undone.`))return;try{const r=await api('/api/admin/orders/'+id+'/refund',{method:'POST',body:JSON.stringify({amount:amt,reason})});Object.assign(o,r.order);toast('Refund issued');openOrder(id);render()}catch(e){toast(e.message)}}
async function resendMail(id,kind){try{const r=await api('/api/admin/orders/'+id+'/email',{method:'POST',body:JSON.stringify({kind})});const o=S.orders.find(x=>x.id===id);Object.assign(o,r.order);toast('Email sent');openOrder(id)}catch(e){toast(e.message)}}
async function testMail(){try{const r=await api('/api/admin/mail-test',{method:'POST',body:'{}'});toast(r.message)}catch(e){toast(e.message)}}
/* ---------- Marketing ---------- */
V.marketing=()=>{const top=[...S.products].filter(isActive).sort((a,b)=>b.price-a.price).slice(0,8);set(`<h1>${S.sub==='coupons'?'Coupons':'Promotions'}</h1>
 <div class="grid g3"><div class="card kpi"><div class="l">Active promotions</div><div class="v">0</div></div><div class="card kpi"><div class="l">Promoted listings</div><div class="v">0</div></div><div class="card kpi"><div class="l">Eligible listings</div><div class="v">${counts().active}</div></div></div>
 <div class="card"><h2>Suggested listings to promote</h2><p class="sub">Highest value active listings. Use bulk price edits in Listings to run a sale (for example select items and enter -10%).</p><table><tbody>${top.map(p=>`<tr><td><img class="thumb" src="${esc(p.images?.[0]||'')}"></td><td><div class="ttl">${esc(p.title)}</div><div class="sub">${esc(p.vendor||'')}</div></td><td><b>${usd(p.price)}</b></td><td><button class="btn sm" onclick="openEditor('${esc(p.id)}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`)};
/* ---------- Performance ---------- */
V.performance=()=>{const c=counts();const tot=S.products.length||1;const withImg=S.products.filter(p=>(p.images||[]).length>=3).length;const withSku=S.products.filter(p=>p.sku).length;const desc=S.products.filter(p=>(p.desc_text||'').length>100).length;const shipped=S.orders.filter(o=>['shipped','delivered'].includes(o.fulfillment_status));const tracked=shipped.filter(o=>o.tracking_number).length;
 const m=(l,v,t)=>`<div class="meter"><span>${l}</span><b>${v}/${t} (${Math.round(v/Math.max(t,1)*100)}%)</b></div><div class="bar"><i style="width:${v/Math.max(t,1)*100}%"></i></div>`;
 if(S.sub==='sales'){set(`<h1>Sales</h1><div class="card"><h2>Last 90 days</h2>${chart(90)}</div><div class="card"><h2>Top selling items</h2>${topItems()}</div>`);return}
 set(`<h1>${S.sub==='traffic'?'Inventory health':'Seller performance'}</h1><div class="grid g4"><div class="card kpi"><div class="l">Seller level</div><div class="v" style="color:var(--green)">${shipped.length&&tracked===shipped.length?'Top rated':'Above standard'}</div></div><div class="card kpi"><div class="l">Orders shipped</div><div class="v">${shipped.length}</div></div><div class="card kpi"><div class="l">Awaiting shipment</div><div class="v">${c.awaiting}</div></div><div class="card kpi"><div class="l">Messages to answer</div><div class="v">${c.unread}</div></div></div>
 <div class="grid g2"><div class="card"><h2>Service metrics</h2>${m('Shipped orders with tracking',tracked,shipped.length)}${m('Listings in stock',c.active,tot)}</div><div class="card"><h2>Listing quality</h2>${m('3+ photos',withImg,tot)}${m('Has SKU / custom label',withSku,tot)}${m('Detailed description',desc,tot)}</div></div>`)};
function topItems(){const m={};S.orders.filter(paid).forEach(o=>o.items.forEach(i=>{m[i.id]=m[i.id]||{...i,q:0,v:0};m[i.id].q+=i.quantity;m[i.id].v+=i.quantity*i.unitAmount}));const L=Object.values(m).sort((a,b)=>b.v-a.v).slice(0,10);return L.length?`<table><thead><tr><th></th><th>Item</th><th>Sold</th><th>Sales</th></tr></thead><tbody>${L.map(i=>`<tr><td><img class="thumb" src="${esc(i.image||'')}"></td><td class="ttl">${esc(i.title)}</td><td>${i.q}</td><td>${usd(i.v)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No paid orders yet.</div>'}
/* ---------- Payments ---------- */
function settle(list){const P=list.filter(paid);const gross=P.reduce((a,o)=>a+Number(o.total),0);const synced=P.filter(o=>netOf(o)!==null);const fees=synced.reduce((a,o)=>a+feeOf(o),0);const refunds=P.reduce((a,o)=>a+Number(o.refunded_amount||0),0);const debit=P.reduce((a,o)=>a+Number(o.refund_debit||0),0);const net=synced.reduce((a,o)=>a+netOf(o),0)-synced.reduce((a,o)=>a+Number(o.refund_debit||0),0);return{P,gross,fees,refunds,debit,net,unsynced:P.length-synced.length}}
function payPill(o){return o.status==='refunded'?'<span class="pill r">Refunded</span>':o.status==='partially_refunded'?'<span class="pill a">Partially refunded</span>':paid(o)?'<span class="pill g">Paid</span>':`<span class="pill a">${esc(o.status)}</span>`}
async function syncAll(){const L=S.orders.filter(o=>paid(o)&&netOf(o)===null);let ok=0;for(const o of L){try{const r=await api('/api/admin/orders/'+o.id+'/settlement',{method:'POST',body:'{}'});Object.assign(o,r.order);ok++}catch(e){toast(e.message)}}toast(`Synced ${ok}/${L.length} orders`);render()}
V.payments=()=>{const st=settle(S.orders);const by=k=>settle(S.orders.filter(o=>o.provider===k));
 const warn=st.unsynced?`<div class="card" style="background:#fff8e6"><b>${st.unsynced} paid order(s)</b> have no fee data yet. Net payout excludes them until synced. <button class="btn sm" onclick="syncAll()">Sync fees from PayPal/Stripe</button></div>`:'';
 if(S.sub==='tx'){set(`<h1>All transactions</h1>${warn}<div class="card"><div class="toolbar"><span style="flex:1"></span><button class="btn ghost" onclick="exportCSV('settlement')">Download</button></div>${S.orders.length?`<div class="tscroll"><table><thead><tr><th>Date</th><th>Order</th><th>Provider</th><th>Status</th><th>Gross</th><th>Fee</th><th>Refunded</th><th>Net payout</th><th></th></tr></thead><tbody>${S.orders.map(o=>`<tr><td class="sub">${day(o.paid_at||o.created_at)}</td><td>${esc(o.reference)}</td><td>${esc(o.provider)}</td><td>${payPill(o)}</td><td>${usd(o.total)}</td><td>${feeOf(o)===null?'<span class="sub">--</span>':'-'+usd(feeOf(o))}</td><td>${Number(o.refunded_amount)?'-'+usd(o.refunded_amount):'<span class="sub">--</span>'}</td><td><b>${finalNet(o)===null?'<span class="sub">pending</span>':usd(finalNet(o))}</b></td><td><button class="btn sm" onclick="openOrder('${o.id}')">View</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No transactions.</div>'}</div>`);return}
 if(S.sub==='monthly'){const m={};S.orders.filter(paid).forEach(o=>{const k=(o.paid_at||o.created_at).slice(0,7);(m[k]=m[k]||[]).push(o)});const ks=Object.keys(m).sort().reverse();
  set(`<h1>Monthly statement</h1>${warn}<div class="card">${ks.length?`<table><thead><tr><th>Month</th><th>Orders</th><th>Gross sales</th><th>Payment fees</th><th>Refunds</th><th>Net payout</th></tr></thead><tbody>${ks.map(k=>{const x=settle(m[k]);return`<tr><td><b>${k}</b></td><td>${x.P.length}</td><td>${usd(x.gross)}</td><td>-${usd(x.fees)}</td><td>-${usd(x.refunds)}</td><td><b>${usd(x.net)}</b>${x.unsynced?` <span class="sub">(${x.unsynced} unsynced)</span>`:''}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No paid orders yet.</div>'}</div>`);return}
 if(S.sub==='refunds'){const R=S.orders.flatMap(o=>(o.refunds||[]).map(r=>({...r,o})));set(`<h1>Refunds (${R.length})</h1><div class="card">${R.length?`<table><thead><tr><th>Date</th><th>Order</th><th>Amount</th><th>Deducted from payout</th><th>Reason</th><th>Status</th></tr></thead><tbody>${R.map(r=>`<tr><td class="sub">${day(r.at)}</td><td><a onclick="openOrder('${r.o.id}')">${esc(r.o.reference)}</a></td><td>-${usd(r.amount)}</td><td>-${usd(r.debit)}</td><td>${esc(r.reason||'')}</td><td><span class="pill">${esc(r.status||'')}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No refunds.</div>'}</div>`);return}
 const card=(l,v,d='')=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div>${d?`<div class="d sub">${d}</div>`:''}</div>`;
 set(`<h1>Payments</h1>${warn}<div class="grid g4">${card('Gross sales',usd(st.gross),st.P.length+' paid orders')}${card('Payment fees','-'+usd(st.fees),'Actual PayPal/Stripe fees')}${card('Refunds','-'+usd(st.refunds),'Deducted from payout: '+usd(st.debit))}${card('Net payout',usd(st.net),'Gross - fees - refunds')}</div>
 <div class="grid g2">${['paypal','stripe'].map(k=>{const x=by(k);return`<div class="card"><h2>${k==='paypal'?'PayPal':'Stripe'}</h2><div class="meter"><span>Gross</span><b>${usd(x.gross)}</b></div><div class="meter"><span>Fees</span><b>-${usd(x.fees)}</b></div><div class="meter"><span>Refunds</span><b>-${usd(x.refunds)}</b></div><div class="meter" style="border-top:1px solid var(--line);padding-top:8px"><span>Net payout</span><b>${usd(x.net)}</b></div></div>`}).join('')}</div>
 <div class="card"><h2>Awaiting payment</h2><p>${usd(S.orders.filter(o=>!paid(o)).reduce((a,o)=>a+Number(o.total),0))} across ${S.orders.filter(o=>!paid(o)).length} unpaid checkout(s). Not included above.</p><p class="sub">Payouts go to your <a href="https://www.paypal.com/myaccount/summary" target="_blank">PayPal</a> / <a href="https://dashboard.stripe.com/payouts" target="_blank">Stripe</a> balance. Fees and net amounts are read from the provider after each capture.</p></div>`)};
/* ---------- Research ---------- */
V.research=()=>{const g={};S.products.forEach(p=>{const k=p.type||'Other';g[k]=g[k]||{n:0,s:0,a:0,min:1e12,max:0};g[k].n++;g[k].s+=Number(p.price);if(isActive(p))g[k].a++;g[k].min=Math.min(g[k].min,p.price);g[k].max=Math.max(g[k].max,p.price)});const L=Object.entries(g).sort((a,b)=>b[1].n-a[1].n);
 const b={};S.products.forEach(p=>{const k=p.vendor||'Other';b[k]=(b[k]||0)+1});const B=Object.entries(b).sort((x,y)=>y[1]-x[1]).slice(0,12);
 set(`<h1>${S.sub==='pricing'?'Pricing':'Catalog insights'}</h1><div class="card"><h2>By category</h2><div class="tscroll"><table><thead><tr><th>Category</th><th>Listings</th><th>Active</th><th>Avg. price</th><th>Price range</th></tr></thead><tbody>${L.map(([k,v])=>`<tr><td><a onclick="S.cat='${esc(k).replace(/'/g,"\\'")}';nav('listings','active')">${esc(k)}</a></td><td>${v.n}</td><td>${v.a}</td><td>${usd(v.s/v.n)}</td><td class="sub">${usd(v.min)} - ${usd(v.max)}</td></tr>`).join('')}</tbody></table></div></div>${S.sub==='pricing'?'':`<div class="card"><h2>Top brands</h2>${B.map(([k,n])=>`<div class="meter"><span>${esc(k)}</span><b>${n}</b></div><div class="bar"><i style="width:${n/B[0][1]*100}%"></i></div>`).join('')}</div>`}`)};
/* ---------- Reports ---------- */
V.reports=()=>set(`<h1>Reports</h1><div class="card"><h2>Download reports</h2><table><tbody>
 <tr><td><b>Active listings</b><div class="sub">All listings with price, quantity and status (CSV)</div></td><td><button class="btn" onclick="exportCSV('listings')">Download</button></td></tr>
 <tr><td><b>Orders</b><div class="sub">All orders with payment and shipping status (CSV)</div></td><td><button class="btn" onclick="exportCSV('orders')">Download</button></td></tr>
 <tr><td><b>Settlement</b><div class="sub">Gross, fees, refunds and net payout per paid order (CSV)</div></td><td><button class="btn" onclick="exportCSV('settlement')">Download</button></td></tr>
 <tr><td><b>Buyer messages</b><div class="sub">Contact form messages (CSV)</div></td><td><button class="btn" onclick="exportCSV('messages')">Download</button></td></tr></tbody></table></div>
 <div class="card"><h2>Email notifications</h2><p class="sub">Buyers automatically get an order confirmation after payment and a shipping notice with tracking when you mark an order as shipped. You get a new-order alert at partscombined@gmail.com.</p><button class="btn" onclick="testMail()">Send test email</button></div>`);
function exportCSV(kind){const rows=kind==='listings'?[['item_id','title','sku','brand','category','condition','price','quantity','status','url'],...listFiltered().map(p=>[p.id,p.title,p.sku,p.vendor,p.type,p.condition||'new',p.price,qty(p),isActive(p)?'active':p.available?'out_of_stock':'ended',location.origin+'/products/'+(p.handle||p.id)+'.html'])]:kind==='settlement'?[['reference','paid_at','provider','capture_id','status','gross','fee','refunded','refund_deducted','net_payout'],...S.orders.filter(paid).map(o=>[o.reference,o.paid_at||o.created_at,o.provider,o.capture_id,o.status,o.total,o.payment_fee??'',o.refunded_amount,o.refund_debit,finalNet(o)??''])]:kind==='orders'?[['reference','date','provider','provider_order_id','payment_status','fulfillment','tracking','buyer_name','buyer_email','ship_to','subtotal','shipping','total','items'],...S.orders.map(o=>[o.reference,o.created_at,o.provider,o.provider_order_id,o.status,o.fulfillment_status,o.tracking_number,o.buyer_name,o.buyer_email,o.shipping_address?[o.shipping_address.line1,o.shipping_address.city,o.shipping_address.state,o.shipping_address.postal_code,o.shipping_address.country].filter(Boolean).join(' '):'',o.subtotal,o.shipping,o.total,o.items.map(i=>i.quantity+'x '+i.title).join(' | ')])]:[['date','name','email','vehicle','status','message'],...S.messages.map(m=>[m.created_at,m.name,m.email,m.vehicle,m.status,m.message])];
 const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`patzcom-${kind}-${new Date().toISOString().slice(0,10)}.csv`;a.click()}
/* ---------- Messages ---------- */
V.messages=()=>{const L=S.messages.filter(m=>S.sub==='unread'?!['read','closed'].includes(m.status):true);set(`<h1>Messages (${L.length})</h1><div class="card"><div class="toolbar"><span style="flex:1"></span><button class="btn ghost" onclick="loadMessages().then(render)">Refresh</button></div>${L.length?`<table><tbody>${L.map(m=>`<tr style="cursor:pointer" onclick="openMsg('${m.id}')"><td>${['read','closed'].includes(m.status)?'':'<b>●</b>'}</td><td><b>${esc(m.name)}</b><div class="sub">${esc(m.email)}</div></td><td><div class="ttl">${esc(m.message)}</div>${m.vehicle?`<div class="sub">Vehicle: ${esc(m.vehicle)}</div>`:''}</td><td class="sub">${day(m.created_at)}</td><td><span class="pill ${m.status==='closed'?'':m.status==='read'?'b':'a'}">${esc(m.status)}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No messages.</div>'}</div>`)};
async function setMsg(id,status){const m=S.messages.find(x=>x.id===id);try{const r=await api('/api/admin/messages/'+id,{method:'PATCH',body:JSON.stringify({status})});Object.assign(m,r.message||{status})}catch(e){toast(e.message)}}
async function openMsg(id){const m=S.messages.find(x=>x.id===id);if(!['read','closed'].includes(m.status))await setMsg(id,'read');openDrawer('Message from '+m.name,`<p class="sub">${esc(m.email)} · ${new Date(m.created_at).toLocaleString()}</p>${m.vehicle?`<p><b>Vehicle:</b> ${esc(m.vehicle)}</p>`:''}<div class="card" style="white-space:pre-wrap">${esc(m.message)}</div>`,`<button class="btn ghost" onclick="setMsg('${id}','closed').then(()=>{closeDrawer();render()})">Mark closed</button><a class="btn pri" href="mailto:${esc(m.email)}?subject=${encodeURIComponent('Re: your PATZCOM inquiry')}">Reply by email</a>`);render()}
/* ---------- Search / load ---------- */
$('#gsearch').onsubmit=e=>{e.preventDefault();const q=$('#gq').value.trim();S.q=q;if(/^PATZCOM-|^[A-Z0-9]{17}$/i.test(q)&&S.orders.some(o=>JSON.stringify(o).toLowerCase().includes(q.toLowerCase())))nav('orders','all');else{S.tab='listings';S.sub='active';S.page=1;S.q=q;if(!listFiltered().length)S.sub='unsold';render()}S.q=q};
$('#logout').onclick=async e=>{e.preventDefault();await fetch('/api/admin/logout',{method:'POST'});location.href='/admin-login.html'};
async function loadProducts(){const r=await api('/api/admin/products');S.products=r.items||[];S.revision=r.revision}
async function loadOrders(){const r=await api('/api/admin/orders');S.orders=r.orders||[]}
async function loadMessages(){const r=await api('/api/admin/messages');S.messages=r.messages||[]}
(async()=>{set('<div class="empty">Loading Seller Hub...</div>');try{const s=await api('/api/admin/session');$('#who').textContent=s.user?.email||'seller'}catch{return}
 await Promise.allSettled([loadProducts(),loadOrders(),loadMessages(),api('/api/admin/dashboard').then(d=>S.dash=d)]);
 const [t,sb]=location.hash.slice(1).split('/');if(t==='more-tools'){location.href='/admin-classic.html#more-tools';return}
 if(TABS.some(x=>x[0]===t)){S.tab=t;S.sub=sb||(SUBS[t]?SUBS[t][0][0]:null)}render()})();
</script></body></html>
